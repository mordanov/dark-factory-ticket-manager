name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticket_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ticket_manager_test
          SECRET_KEY: ci-secret-key-not-used-in-production
          REFRESH_TOKEN_SECRET: ci-refresh-secret-not-used-in-production
          ENVIRONMENT: test
          LOG_LEVEL: WARNING
        run: alembic upgrade head

      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ticket_manager_test
          SECRET_KEY: ci-secret-key-not-used-in-production
          REFRESH_TOKEN_SECRET: ci-refresh-secret-not-used-in-production
          ENVIRONMENT: test
          LOG_LEVEL: WARNING
        run: pytest tests/integration/ tests/contract/ -v --tb=short

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    name: Frontend — type-check, lint, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npx eslint src/ --max-warnings 0

      - name: Test (vitest)
        run: npm run test:run

      - name: Build (vite)
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
